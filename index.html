<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NyF Argentina — Consultas</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b141a;--bin:#202c33;--bout:#005c4b;--txt:#e9edef;--mut:#8696a0;--grn:#00a884;--hdr:#202c33;--bdr:#1f2c34}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--txt)}
.wrap{display:flex;flex-direction:column;height:100vh;max-width:640px;margin:0 auto}
.topbar{background:var(--hdr);padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--bdr);flex-shrink:0}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#005c4b,#00a884);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex-shrink:0}
.cn{font-size:15px;font-weight:600}.cs{font-size:12px;color:var(--mut)}
.msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.msgs::-webkit-scrollbar{width:4px}
.msgs::-webkit-scrollbar-thumb{background:#2a3942;border-radius:2px}
.mg{display:flex;flex-direction:column;gap:2px;margin-bottom:5px;animation:mi .2s ease}
@keyframes mi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.mw{display:flex}.mw.out{flex-direction:row-reverse}
.bub{max-width:80%;padding:9px 12px;border-radius:10px;font-size:15px;line-height:1.5;word-break:break-word}
.bub.in{background:var(--bin);border-top-left-radius:2px}
.bub.out{background:var(--bout);border-top-right-radius:2px}
.ts{font-size:10px;color:var(--mut);margin-top:2px;padding:0 2px}
.mw.out .ts{text-align:right}
.twrap{display:flex;margin-bottom:5px}
.typing{display:flex;align-items:center;gap:4px;padding:10px 14px;background:var(--bin);border-radius:10px;border-top-left-radius:2px}
.td{width:7px;height:7px;border-radius:50%;background:var(--mut);animation:td 1.2s infinite}
.td:nth-child(2){animation-delay:.2s}.td:nth-child(3){animation-delay:.4s}
@keyframes td{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}
.ibar{background:var(--hdr);padding:10px 12px;display:flex;align-items:center;gap:10px;border-top:1px solid var(--bdr);flex-shrink:0}
.inp{flex:1;background:#2a3942;border:none;border-radius:26px;padding:11px 16px;color:var(--txt);font-family:'DM Sans',sans-serif;font-size:15px;outline:none}
.inp::placeholder{color:var(--mut)}
.sbtn{width:44px;height:44px;border-radius:50%;background:var(--grn);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:19px;flex-shrink:0;transition:background .15s}
.sbtn:hover{background:#008f72}
.sbtn:disabled{background:#2a3942;cursor:not-allowed}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="av">N</div>
    <div>
      <div class="cn">NyF Argentina</div>
      <div class="cs" id="stat">en linea</div>
    </div>
  </div>
  <div class="msgs" id="msgs"></div>
  <div class="ibar">
    <input class="inp" id="inp" type="text" placeholder="Escribi un mensaje..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}">
    <button class="sbtn" id="sbtn" onclick="send()">&#10148;</button>
  </div>
</div>

<script>
var chatHistory = [];
var busy = false;
var msgsEl = document.getElementById('msgs');
var typingEl = null;

function ts(){var d=new Date();return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function renderMsg(dir,text){
  var g=document.createElement('div');g.className='mg';
  var w=document.createElement('div');w.className='mw'+(dir==='out'?' out':'');
  var b=document.createElement('div');b.className='bub '+dir;
  b.innerHTML=esc(text).replace(/\n/g,'<br>').replace(/\*(.*?)\*/g,'<strong>$1</strong>');
  var t=document.createElement('div');t.className='ts';
  t.textContent=ts()+(dir==='out'?' visto':'');
  b.appendChild(t);w.appendChild(b);g.appendChild(w);
  msgsEl.appendChild(g);msgsEl.scrollTop=msgsEl.scrollHeight;
}

function showTyping(){
  typingEl=document.createElement('div');typingEl.className='twrap';
  typingEl.innerHTML='<div class="typing"><div class="td"></div><div class="td"></div><div class="td"></div></div>';
  msgsEl.appendChild(typingEl);msgsEl.scrollTop=msgsEl.scrollHeight;
  document.getElementById('stat').textContent='escribiendo...';
  document.getElementById('sbtn').disabled=true;
}
function hideTyping(){
  if(typingEl){typingEl.remove();typingEl=null;}
  document.getElementById('stat').textContent='en linea';
  document.getElementById('sbtn').disabled=false;
}

async function send(){
  if(busy)return;
  var inp=document.getElementById('inp');
  var val=inp.value.trim();
  if(!val)return;
  inp.value='';busy=true;
  renderMsg('out',val);
  chatHistory.push({role:'user',content:val});
  showTyping();
  try{
    var res=await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:chatHistory})
    });
    var data=await res.json();
    hideTyping();
    if(data.error){renderMsg('in','Hubo un problema. Intenta de nuevo.');busy=false;return;}
    chatHistory.push({role:'assistant',content:data.reply});
    renderMsg('in',data.reply);
  }catch(err){
    hideTyping();
    renderMsg('in','Error de conexion.');
  }
  busy=false;
}

var first='Hola, buen dia. Gracias por escribirnos a NyF Argentina. Como es tu nombre?';
chatHistory.push({role:'assistant',content:first});
renderMsg('in',first);
</script>
</body>
</html>
